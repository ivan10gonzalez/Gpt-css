<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Universe Player</title><link rel="stylesheet" href="app.css"></head><body><div class="player-shell"><header class="topbar playerbar"><div class="brand">UNIVERSE <span>GAME</span></div><div class="top-actions"><span id="playerName"></span><button onclick="logout()" class="ghost">Salir</button></div></header><main class="player-content"><section class="hero"><div><p class="eyebrow">PLATAFORMA DE JUGADOR</p><h1>Tu universo, en un solo lugar.</h1><p class="muted">Créditos virtuales para pruebas del flujo.</p></div><div class="hero-balance"><span>Saldo disponible</span><strong id="playerBalance">0</strong></div></section><div class="player-grid"><section class="card"><h3>Juegos de demostración</h3><div class="game-grid"><article class="game"><div class="game-art">♠</div><h4>Blackjack Demo</h4><p>Sesión de práctica</p><button class="primary" onclick="play(1000)">Jugar 1.000</button></article><article class="game"><div class="game-art">◆</div><h4>Ruleta Demo</h4><p>Resultado simulado</p><button class="primary" onclick="play(500)">Jugar 500</button></article><article class="game"><div class="game-art">★</div><h4>Slots Demo</h4><p>Máquina visual</p><button class="primary" onclick="play(250)">Jugar 250</button></article></div><div id="gameMsg" class="error"></div></section><section class="card"><h3>Últimos movimientos</h3><div id="playerLedger" class="timeline"></div></section></div></main></div><script src="player.js"></script></body></html>
