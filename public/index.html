<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Universe Portal</title><link rel="stylesheet" href="app.css"></head><body><main class="gate"><section class="gate-card"><div class="brand">UNIVERSE <span>GAME</span></div><p class="eyebrow">ENTORNO DEMO</p><h1>Ingresá a tu plataforma</h1><p class="muted">Una sola entrada para administración y jugadores.</p><form id="login"><label>Usuario<input name="username" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">INGRESAR</button><div id="loginErr" class="error"></div></form><div class="demo-hint">Master: <b>masteradmin</b> / <b>demo1234</b> · Jugador: <b>jugador01</b> / <b>demo1234</b></div></section></main><script>login.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();if(!r.ok)return loginErr.textContent=d.error||'Error';location.href=d.redirect})</script></body></html>
